name: Backup diário do banco Supabase

on:
  schedule:
    # 06:00 UTC = 03:00 horário de Brasília
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Clonar repositório de backups
        uses: actions/checkout@v4
        with:
          repository: sistemasbiomassa-blip/biomassa-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: biomassa-backups

      - name: Gerar dump do banco
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p biomassa-backups/dumps
          FILENAME="biomassa-backups/dumps/backup-$(date -u +%Y-%m-%d).sql"
          pg_dump \
            -h "${{ secrets.SUPABASE_DB_HOST }}" \
            -p "${{ secrets.SUPABASE_DB_PORT }}" \
            -U "${{ secrets.SUPABASE_DB_USER }}" \
            -d "${{ secrets.SUPABASE_DB_NAME }}" \
            --no-owner --no-privileges \
            -f "$FILENAME"
          gzip "$FILENAME"

      - name: Remover backups com mais de 30 dias
        run: |
          find biomassa-backups/dumps -name "backup-*.sql.gz" -mtime +30 -delete

      - name: Commitar e enviar backup
        working-directory: biomassa-backups
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add dumps
          git diff --cached --quiet && echo "Nada novo para commitar" && exit 0
          git commit -m "Backup $(date -u +%Y-%m-%d)"
          git push
